<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Representative TransiSafe 2.0 batch-analysis output</title>
  <desc id="desc">A terminal-style summary of the documented 500-point validation run.</desc>
  <rect width="1600" height="900" fill="#06100c"/>
  <rect x="58" y="52" width="1484" height="796" rx="22" fill="#09150f" stroke="#20362d" stroke-width="3"/>
  <path d="M80 52h1440a22 22 0 0 1 22 22v53H58V74a22 22 0 0 1 22-22Z" fill="#102118"/>
  <circle cx="95" cy="79" r="11" fill="#ff5f57"/>
  <circle cx="132" cy="79" r="11" fill="#ffbd2e"/>
  <circle cx="169" cy="79" r="11" fill="#00c48c"/>
  <g font-family="Consolas, 'Courier New', monospace">
