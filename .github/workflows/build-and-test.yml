name: Windows Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure CMake
        run: cmake -S . -B build -A x64

      - name: Build TransiSafe and unit tests
        run: cmake --build build --config Release

      - name: Run unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test analysis API adapter
        shell: pwsh
        run: |
          python -m pip install -r api/requirements.txt
          $env:TRANSISAFE_ENGINE = (Resolve-Path ".\build\Release\transisafe_json.exe")
          python -m api.smoke_test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build browser application
        run: |
          npm ci --prefix web
          npm run build --prefix web

      - name: Run MOSFET CSV smoke test
        shell: pwsh
        run: |
          Remove-Item results.csv, summary.csv, transisafe.log `
            -ErrorAction SilentlyContinue

          "2`noperating_points_mosfet.csv`n" |
            & ".\build\Release\transisafe.exe"

          if ($LASTEXITCODE -ne 0) {
            throw "TransiSafe exited with code $LASTEXITCODE."
          }

          if (-not (Test-Path "summary.csv")) {
            throw "summary.csv was not generated."
          }

          $summary = Import-Csv "summary.csv"

          function Get-KpiValue($name) {
            $row = $summary |
              Where-Object {
                $_.scope -eq "overall" -and
                $_.kpi -eq $name
              } |
              Select-Object -First 1

            if ($null -eq $row) {
              throw "KPI '$name' is missing."
            }

            return [int][double]$row.numeric_value
          }

          $total = Get-KpiValue "total_points"
          $safe = Get-KpiValue "safe_count"
          $critical = Get-KpiValue "critical_count"
          $notSafe = Get-KpiValue "not_safe_count"

          if ($total -ne 2) { throw "Expected 2 points, received $total." }
          if ($safe -ne 2 -or $critical -ne 0 -or $notSafe -ne 0) {
            throw "Expected two SAFE reference points."
          }
          if (($safe + $critical + $notSafe) -ne $total) {
            throw "Status counts do not add up to total points."
          }

          "2`noperating_points_regression_mosfet.csv`n" |
            & ".\build\Release\transisafe.exe"

          if ($LASTEXITCODE -ne 0) {
            throw "Regression analysis exited with code $LASTEXITCODE."
          }

          $summary = Import-Csv "summary.csv"
          $total = Get-KpiValue "total_points"
          $notSafe = Get-KpiValue "not_safe_count"
          $voltage = Get-KpiValue "not_safe_voltage_count"
          $current = Get-KpiValue "not_safe_current_count"
          $soa = Get-KpiValue "not_safe_soa_count"
          $insufficient = Get-KpiValue "insufficient_data_count"

          if ($total -ne 4 -or $notSafe -ne 4) {
            throw "Expected four rejected regression points."
          }
          if ($voltage -ne 1 -or $current -ne 1 -or $soa -ne 1 -or $insufficient -ne 1) {
            throw "Regression failure reasons do not match expectations."
          }

          Write-Host "Smoke test passed successfully."
